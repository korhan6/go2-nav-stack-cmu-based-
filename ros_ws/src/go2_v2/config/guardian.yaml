# go2_guardian: el unico que le habla al perro. Limites DUROS (el planificador de CMU ya va por
# debajo: maxSpeed en 'go2v2 lanzar velocidad:=...')
go2_guardian:
  ros__parameters:
    vx_max: 1.0                 # m/s adelante/atras
    vy_max: 0.6                 # m/s de lado (el perro esquiva en diagonal)
    wz_max: 1.5                 # rad/s de giro
    vigencia: 0.25              # s: si el planificador no manda nada en este tiempo -> StopMove
    freewalk: true              # al levantarse/desbloquear: marcha FreeWalk (firmware >= 1.1.7)
    v_min_caminar: 0.0          # 0 = no tocar. (con 0.2 se pasaba de la meta y volvia: ahora frena antes, ver slowDwnDisThre)
    apagar_evitacion_unitree: true
    lidar_max_edad: 0.5         # s sin nube del lidar (/registered_scan) -> quieto. 0 = no revisar
    giro_max_s: 6.0             # s girando en el sitio sin avanzar -> quieto (paredes falsas). 0 = no revisar
    salto_vel: 2.5              # m/s: la pose se mueve mas rapido que esto = el SLAM salto -> quieto hasta relanzar
    salto_giro: 4.0             # rad/s: idem para el rumbo
    vueltas_rad: 4.0            # rad girados en vueltas_s s sin alejarse 0.5 m = da vueltas -> quieto. 0 = no revisar
    vueltas_s: 8.0
    coherencia_m: 0.05          # girando en el sitio el lidar debe quedar >0.05 m delante del centro (sano ~0.2). 0 = no revisar
    # suavizado de ordenes (sin tirones ni cambios de sentido de golpe). suavizar: false = como antes
    suavizar: true
    acc_lin: 0.8                # m/s^2 al acelerar adelante/atras (0 -> 0.4 m/s en 0.5 s)
    dec_lin: 1.5                # m/s^2 al frenar
    acc_lat: 0.6                # de lado
    dec_lat: 1.2
    acc_giro: 2.0               # rad/s^2 al empezar a girar (0 -> 60 grados/s en 0.5 s)
    dec_giro: 3.0               # rad/s^2 al dejar de girar o cambiar de sentido
    tau_giro: 0.15              # s: filtro del giro (se come el temblor; mas alto = mas suave y mas lento)
    # LLEGADA: desde frenar_desde m de la meta baja el tope de velocidad y giro en rampa (hasta v_llegada /
    # giro_llegada a d_llegada m) y cuando go2_metas dice que llego se queda QUIETO hasta otra meta o hasta
    # que muevas el control. llegada_suave: false = como antes
    llegada_suave: true
    frenar_desde: 1.5           # m de la meta: empieza a bajar
    d_llegada: 0.4              # m: aca ya va al minimo
    v_lejos: 0.5                # m/s: tope en 'frenar_desde' (si va mas lento, no cambia nada)
    v_llegada: 0.25             # m/s: tope al final (el Go2 por debajo de ~0.2 pisa en el sitio)
    giro_llegada: 0.5           # rad/s: tope de giro al final (~30 grados/s)
    # FRENO DE CERCANIA: si hay algo (mas de freno_alto sobre el piso) a menos de freno_margen m (+ freno_margen_v
    # x velocidad) de la nariz / la cola / los costados, no se mueve hacia ahi (girar y alejarse si). Ultima red
    # de seguridad aparte del planificador; no aplica manejando sin evasion. freno_cercania: false = sin freno
    freno_cercania: true
    freno_margen: 0.30          # m delante de la nariz
    freno_margen_v: 0.4         # m extra por cada m/s
    freno_alto: 0.25            # m sobre el piso: desde aca es obstaculo para el freno
    freno_largo: 0.70           # m: el cuerpo del Go2
    freno_ancho: 0.36
